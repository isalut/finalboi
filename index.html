<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#082444" />
  <title>BOI Cash Equalisation System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="brand-row">
      <div class="boi-mark" aria-hidden="true">BOI</div>
      <div class="brand-text">
        <p class="bank-kicker">BANK OF INDIA &bull; TELLER DESK</p>
        <h1 class="app-title">Cash Equalisation System</h1>
      </div>
    </div>
    <span class="offline-pill">OFFLINE</span>
  </header>

  <main class="container">
    <nav class="mode-switch" role="tablist" aria-label="Cash count session">
      <button id="tab-morning" class="mode-btn active" role="tab" aria-selected="true" type="button">
        <span class="tab-title">Morning Cash</span>
        <span id="badge-morning" class="tab-total">&#8377;0</span>
      </button>
      <button id="tab-evening" class="mode-btn" role="tab" aria-selected="false" type="button">
        <span class="tab-title">Evening Cash</span>
        <span id="badge-evening" class="tab-total">&#8377;0</span>
      </button>
    </nav>

    <section class="summary-card" aria-live="polite">
      <div class="summary-header">
        <span id="session-label" class="summary-label">MORNING CASH TOTAL</span>
        <span id="session-pieces" class="summary-pieces">0 pcs</span>
      </div>
      <div id="session-total" class="summary-amount">&#8377;0</div>
      <div class="mini-compare">
        <span>Morning: <strong id="mini-morning">&#8377;0</strong></span>
        <span>Evening: <strong id="mini-evening">&#8377;0</strong></span>
      </div>
    </section>

    <section id="result-banner" class="result-banner hidden" role="status" aria-live="assertive" tabindex="-1">
      <div id="result-badge" class="result-badge"></div>
      <h2 id="result-heading" class="result-heading"></h2>
      <p id="result-diff" class="result-diff"></p>
      <p id="result-subtext" class="result-subtext"></p>
    </section>

    <section class="denom-section" aria-label="Currency denominations">
      <div class="list-header">
        <span class="col-denom">Denomination</span>
        <span class="col-count">Count</span>
        <span class="col-amount align-right">Amount</span>
      </div>
      <div id="denomination-list" class="denom-list"></div>
    </section>
  </main>

  <footer class="action-bar">
    <button id="btn-reset" class="btn-secondary" type="button">Reset</button>
    <button id="btn-check" class="btn-primary" type="button">Check Cash</button>
  </footer>

  <!-- Cash Check Result Pop-up Modal -->
  <div id="result-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="result-modal-heading">
    <div id="result-modal-card" class="modal-card result-modal-card">
      <div id="result-modal-badge" class="result-badge"></div>
      <h2 id="result-modal-heading" class="result-heading"></h2>
      <p id="result-modal-statement" class="result-modal-statement"></p>
      <div class="result-modal-breakdown">
        <div><span>Morning Cash</span><strong id="modal-morning-val">&#8377;0</strong></div>
        <div><span>Evening Cash</span><strong id="modal-evening-val">&#8377;0</strong></div>
        <div><span>Difference</span><strong id="modal-diff-val">&#8377;0</strong></div>
      </div>
      <div class="modal-actions single-action">
        <button id="result-modal-close" class="btn-primary" type="button">OK</button>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal for Reset -->
  <div id="reset-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title">
    <div class="modal-card">
      <h2 id="reset-modal-title">Reset Cash Counts?</h2>
      <p>This will clear all Morning and Evening denomination counts and reset the check status.</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary" type="button">Cancel</button>
        <button id="modal-confirm" class="btn-danger" type="button">Yes, Reset All</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
